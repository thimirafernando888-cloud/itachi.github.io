<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thimira | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="video-container">
        <video autoplay loop muted playsinline id="bg-video">
            <source src="bg.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <div class="glow-ring"></div>

    <main class="container">
        <header class="profile-card">
            <div class="badge">SYSTEM ACTIVE</div>
            <h1 class="glitch-text">THIMIRA</h1>
            <p class="subtitle">Tech Enthusiast & Language Scholar</p>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="label">LOCATION</span>
                    <span class="value">Galle, LK</span>
                </div>
                <div class="stat-box">
                    <span class="label">STATUS</span>
                    <span class="value">JLPT N5 Passed</span>
                </div>
            </div>
        </header>

        <section class="glass-section">
            <h2><span class="purple-text">//</span> CORE HARDWARE</h2>
            <div class="specs-grid">
                <div class="spec-card">
                    <span class="icon">⚡</span>
                    <div>
                        <h3>Graphics Engine</h3>
                        <p>NVIDIA GTX 1050 Ti 4GB</p>
                    </div>
                </div>
                <div class="spec-card">
                    <span class="icon">🎯</span>
                    <div>
                        <h3>Primary Focus</h3>
                        <p>JFT-Basic & Web3 Tech</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="glass-section">
            <h2><span class="purple-text">//</span> ALMIGHTY PUSH TERMINAL</h2>
            <p class="terminal-desc">Click below to trigger the Rinnegan gravity field.</p>
            <button id="shinra-btn" class="web3-btn">EXECUTE SHINRA TENSEI</button>
            <div id="status-output" class="status-box">SYSTEM READY...</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
